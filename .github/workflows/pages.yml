name: Pages redirect

on:
  push:
    branches: [main]
    paths:
      - 'redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: cp redirect/index.html redirect/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v5

name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler d1 migrations apply trio-sprint-scores --local
      - name: Integration tests
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run dev > /tmp/trio-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/scores > /dev/null; then break; fi
            sleep 1
          done
          npm run test:integration

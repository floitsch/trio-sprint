<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://trio-sprint.floitsch.workers.dev/">
  <title>Trio Sprint has moved</title>
  <style>body { font: 18px system-ui; background: #f5f3ed; color: #202b38; max-width: 32rem; margin: 15vh auto; padding: 24px; } a { color: #b74623; }</style>
</head>
<body>
  <h1>Trio Sprint has moved</h1>
  <p><a id="destination" href="https://trio-sprint.floitsch.workers.dev/">Continue to Trio Sprint</a></p>
  <script>
    const destination = new URL('https://trio-sprint.floitsch.workers.dev/');
    destination.search = location.search;
    destination.hash = location.hash;
    document.getElementById('destination').href = destination.href;
    location.replace(destination.href);
  </script>
</body>
</html>
